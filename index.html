<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Gabriel PC Renderer (TCC - UFJF)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="dataset-selector" class="minilog-control"
        style="position: absolute; top: 20px; left: 20px; z-index: 100; padding: 20px; background: rgba(0, 0, 0, 0.85); border-radius: 8px; color: #fff; font-family: sans-serif; max-height: 90vh; overflow-y: auto;">

        <h2 style="margin-top: 0; margin-bottom: 15px; font-size: 36px; border-bottom: 1px; padding-bottom: 10px;">
            Select cloud:</h2>

        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
            <thead>
                <tr style="border-bottom: 2px solid #555;">
                    <th style="padding: 10px;">Cloud Name</th>
                    <th style="padding: 10px; white-space: nowrap;">Size</th>
                    <th style="padding: 10px;">RGB?</th>
                    <th style="padding: 10px;">Description</th>
                    <th style="padding: 10px;">Source</th>
                    <th style="padding: 10px;"></th>
                </tr>
            </thead>
            <tbody id="dataset-table-body">
            </tbody>
        </table>
    </div>

    <div id="miniLog" class="minilog-control"
        style="position: absolute; top: 10px; left: 10px; z-index: 100; display: none; flex-direction: column; gap: 10px;">
        <div id="log-content">Carregando...</div>
        <button onclick="exitToMenu()">Voltar ao Menu</button>
    </div>
    <script>window.exitToMenu = function () {
            document.getElementById('miniLog').style.display = 'none';
            document.getElementById('dataset-selector').style.display = 'block';
            window.clearScene();
        };

        window.loadDataset = function (folderName) {
            document.getElementById('dataset-selector').style.display = 'none';
            document.getElementById('miniLog').style.display = 'flex';
            window.init(folderName);
        };</script>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
